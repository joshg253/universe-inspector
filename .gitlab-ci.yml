# Checks on every branch push and merge request (not tags): the core invariants, then the typecheck + static build.
# Keep the image's major version in step with .nvmrc.
workflow:
  rules:
    # One pipeline per change: merge request pipelines when an MR is open, branch pipelines otherwise.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: node:24

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

stages:
  - check

install-and-check:
  stage: check
  script:
    - node --version
    - npm ci --prefer-offline
    - npm test
    - npm run build
    - test -s dist/index.html
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Advisory: known-vulnerable dependencies. Does not fail the pipeline.
audit:
  stage: check
  script:
    - npm audit --audit-level=high
  allow_failure: true
